<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Paper wash background -->
    <radialGradient id="bgA" cx="20%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#c3592b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#c3592b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgB" cx="80%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#c3592b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c3592b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c3592b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c3592b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c3592b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Cream paper background -->
  <rect width="1200" height="630" fill="#faf6f0"/>
  <rect width="1200" height="630" fill="url(#bgA)"/>
  <rect width="1200" height="630" fill="url(#bgB)"/>

  <!-- Inner frame border — hairline terracotta -->
  <rect
    x="28" y="28" width="1144" height="574"
    fill="none"
    stroke="#c3592b"
    stroke-opacity="0.35"
    stroke-width="1"
  />

  <!-- Top-left mark -->
  <g transform="translate(60 72)" font-family="Georgia, 'Times New Roman', serif">
    <text
      fill="#c3592b"
      font-size="34"
      font-weight="400"
      letter-spacing="-0.5"
    >अर्थ</text>
    <text
      x="90" y="-2"
      fill="#c3592b"
      fill-opacity="0.78"
      font-size="20"
      font-style="italic"
      font-weight="300"
    >Mala</text>
  </g>

  <!-- Decorative mandala medallion (right side) -->
  <g transform="translate(980 315)" stroke="#c3592b" stroke-opacity="0.45" fill="none" stroke-linecap="round">
    <circle r="160" stroke-width="1.25"/>
    <circle r="130" stroke-width="1"/>
    <circle r="95" stroke-width="1"/>
    <circle r="55" stroke-width="1"/>

    <!-- 16 petals -->
    <g stroke-width="1.1">
      <line x1="0" y1="-150" x2="0" y2="-65"/>
      <line x1="0" y1="150" x2="0" y2="65"/>
      <line x1="-150" y1="0" x2="-65" y2="0"/>
      <line x1="150" y1="0" x2="65" y2="0"/>
      <line x1="-106" y1="-106" x2="-46" y2="-46"/>
      <line x1="106" y1="106" x2="46" y2="46"/>
      <line x1="-106" y1="106" x2="-46" y2="46"/>
      <line x1="106" y1="-106" x2="46" y2="-46"/>

      <line x1="-57" y1="-138" x2="-25" y2="-60"/>
      <line x1="57" y1="138" x2="25" y2="60"/>
      <line x1="-138" y1="-57" x2="-60" y2="-25"/>
      <line x1="138" y1="57" x2="60" y2="25"/>
      <line x1="57" y1="-138" x2="25" y2="-60"/>
      <line x1="-57" y1="138" x2="-25" y2="60"/>
      <line x1="-138" y1="57" x2="-60" y2="25"/>
      <line x1="138" y1="-57" x2="60" y2="25"/>
    </g>

    <!-- Inner star -->
    <g stroke-width="1.1">
      <line x1="0" y1="-45" x2="0" y2="45"/>
      <line x1="-45" y1="0" x2="45" y2="0"/>
      <line x1="-32" y1="-32" x2="32" y2="32"/>
      <line x1="32" y1="-32" x2="-32" y2="32"/>
    </g>
    <circle r="10" stroke-width="1.2"/>
    <circle r="3" fill="#c3592b" stroke="none" fill-opacity="0.8"/>
  </g>

  <!-- Main composition (left column) -->
  <g transform="translate(90 270)" font-family="Georgia, 'Times New Roman', serif">
    <!-- Eyebrow -->
    <text
      fill="#c3592b"
      font-size="20"
      font-style="italic"
      letter-spacing="6"
      text-transform="uppercase"
    >A B O U T I Q U E   S T U D I O</text>

    <!-- Devanagari mark (huge) -->
    <text
      y="105"
      fill="#c3592b"
      font-size="130"
      font-weight="400"
      letter-spacing="-2"
    >अर्थ</text>

    <!-- Latin -->
    <text
      x="4" y="165"
      fill="#c3592b"
      fill-opacity="0.78"
      font-size="60"
      font-style="italic"
      font-weight="300"
      letter-spacing="1"
    >Mala</text>

    <!-- Rule -->
    <line x1="0" y1="210" x2="560" y2="210" stroke="url(#rule)" stroke-width="1"/>

    <!-- Tagline -->
    <text
      y="248"
      fill="#3c3731"
      font-size="26"
      font-style="italic"
      letter-spacing="3"
    >Art that Heals · Patterns that Speak</text>
  </g>

  <!-- Bottom meta line -->
  <g transform="translate(90 580)" font-family="Georgia, 'Times New Roman', serif">
    <text
      fill="#6b655c"
      font-size="16"
      font-style="italic"
      letter-spacing="3"
    >Lipan  ·  Mandala  ·  Embroidery  ·  Crochet</text>
  </g>

  <!-- Bottom-right small domain mark -->
  <text
    x="1140" y="592"
    text-anchor="end"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="14"
    fill="#9b8e7a"
    letter-spacing="2"
  >arthmala.com</text>
</svg>
